<svg width="100%" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
<title>Gustavo Lopreto — Cybersecurity</title>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <filter id="glass" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
    <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.02  0 1 0 0 0.02  0 0 1 0 0.02  0 0 0 0.6 0" result="tint"/>
    <feComposite in="SourceGraphic" in2="tint" operator="over"/>
  </filter>
  <linearGradient id="glass-fill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
  </linearGradient>
  <linearGradient id="glass-stroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.14"/>
  </linearGradient>
  <linearGradient id="fade-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c0c0c0" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#c0c0c0" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Background -->
<rect width="800" height="220" fill="#050505"/>

<!-- Subtle grid -->
<g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
  <line x1="0" y1="55" x2="800" y2="55"/>
  <line x1="0" y1="110" x2="800" y2="110"/>
  <line x1="0" y1="165" x2="800" y2="165"/>
  <line x1="200" y1="0" x2="200" y2="220"/>
  <line x1="400" y1="0" x2="400" y2="220"/>
  <line x1="600" y1="0" x2="600" y2="220"/>
</g>

<!-- Floating orbs with slow drift -->
<circle cx="120" cy="80" r="80" fill="url(#orb1)">
  <animate attributeName="cx" values="120;150;120" dur="12s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="80;100;80" dur="15s" repeatCount="indefinite"/>
</circle>
<circle cx="650" cy="160" r="100" fill="url(#orb2)">
  <animate attributeName="cx" values="650;620;650" dur="14s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="160;130;160" dur="11s" repeatCount="indefinite"/>
</circle>
<circle cx="400" cy="40" r="60" fill="url(#orb1)">
  <animate attributeName="cx" values="400;430;400" dur="16s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="40;60;40" dur="13s" repeatCount="indefinite"/>
</circle>

<!-- Floating particles -->
<g fill="#ffffff">
  <circle cx="90" cy="30" r="1" opacity="0.15">
    <animate attributeName="cy" values="30;25;30" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="180" r="0.8" opacity="0.12">
    <animate attributeName="cy" values="180;172;180" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.25;0.12" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="50" r="1.2" opacity="0.1">
    <animate attributeName="cy" values="50;42;50" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.22;0.1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="90" r="0.7" opacity="0.18">
    <animate attributeName="cy" values="90;84;90" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0.35;0.18" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="200" r="0.9" opacity="0.1">
    <animate attributeName="cy" values="200;193;200" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="140" r="1" opacity="0.08">
    <animate attributeName="cy" values="140;132;140" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="160" r="0.6" opacity="0.14">
    <animate attributeName="cy" values="160;155;160" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="40" r="0.8" opacity="0.12">
    <animate attributeName="cy" values="40;34;40" dur="6.5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Glass panel -->
<rect x="45" y="35" width="710" height="150" rx="16" fill="url(#glass-fill)" stroke="url(#glass-stroke)" stroke-width="1" filter="url(#glass)"/>

<!-- Scan line -->
<rect x="45" y="35" width="710" height="1" fill="#ffffff" opacity="0.06" rx="0">
  <animate attributeName="y" values="35;185;35" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.06;0.03;0.06" dur="8s" repeatCount="indefinite"/>
</rect>

<!-- Name -->
<text x="400" y="95" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="32" font-weight="300" fill="#f0f0f0" text-anchor="middle" letter-spacing="4" filter="url(#glow)">GUSTAVO LOPRETO</text>

<!-- Title -->
<text x="400" y="128" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="12" fill="#808080" text-anchor="middle" letter-spacing="6">CYBERSECURITY</text>

<!-- Blinking cursor -->
<rect x="466" y="117" width="8" height="14" fill="#808080" opacity="0.5">
  <animate attributeName="opacity" values="0.5;0;0.5" dur="1.2s" repeatCount="indefinite"/>
</rect>

<!-- Subtle corner accents -->
<path d="M46 50 L46 36 L60 36" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
<path d="M754 50 L754 36 L740 36" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
<path d="M46 170 L46 184 L60 184" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
<path d="M754 170 L754 184 L740 184" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>

<!-- Bottom fade line -->
<rect x="0" y="218" width="800" height="1" fill="url(#fade-line)"/>
</svg>
